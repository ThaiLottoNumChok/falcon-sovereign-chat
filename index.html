            font-size: 0.8rem;

            background-color: var(--primary-orange);

            align-self: flex-end;
        }

            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 6px;

        .input-wrapper {

            gap: 8px;
            align-items: center;

            background-color: transparent;

    </style>
</head>

        <header class="terminal-header">
            <div>[SYS-STATUS: FALCON_COMM_CORE_V1.0]</div>
            <div>ONLINE <span class="status-dot"></span></div>
        </header>

        <!-- CHAT FEED -->
        <main class="chat-feed" id="chat-feed">

            </div>
        </main>

        <!-- INPUT CONTROLS -->
        <footer class="control-panel">
            <!-- คลังคิวอัปโหลดรูปภาพ -->
            <div class="upload-status-bar" id="status-bar">
                <span id="status-text">เตรียมการอัปโหลด: 0 ยูนิต</span>
                <div class="preview-grid" id="preview-grid"></div>
            </div>

            <div class="input-wrapper">
                <!-- ปุ่มคลิกเดียวเลือกได้หลายรูป (Bulk Upload Button) -->
                <button class="btn-action btn-attach" onclick="triggerFileInput()" title="แนบไฟล์รูปภาพมหาประลัย">
                    [ATTACH CHIBI]
                </button>
                <input type="file" id="bulk-file-input" multiple accept="image/*" onchange="handleFileSelection()">

                <input type="text" class="chat-input" id="chat-msg" placeholder="ป้อนคำสั่งยุทธการ..." onkeypress="handleKeyPress(event)">
                <button class="btn-action" onclick="executeSend()">[FIRE]</button>
            </div>
        </footer>
    </div>

    <script>
        const fileInput = document.getElementById('bulk-file-input');
        const statusBar = document.getElementById('status-bar');
        const statusText = document.getElementById('status-text');
        const previewGrid = document.getElementById('preview-grid');
        const chatFeed = document.getElementById('chat-feed');
        const chatMsg = document.getElementById('chat-msg');

        let selectedFilesBucket = []; // ถังพักไฟล์สำหรับส่งพร้อมกัน

        // เปิดหน้าต่างเลือกไฟล์ (จำลองการคลิกอินพุต)
        function triggerFileInput() {
            fileInput.click();
        }

        // จัดการเมื่อบอสกดยกพวกเลือกไฟล์ทหารจิ๋ว (Multi-file Handling)
        function handleFileSelection() {
            const files = Array.from(fileInput.files);
            if (files.length === 0) return;

            // รวมไฟล์เข้าคลังสแตนด์บาย (แก้วิกฤตการส่งทีละรูป)
            selectedFilesBucket = [...selectedFilesBucket, ...files];
            updateUploadUI();
        }

        // อัปเดตหน้ากากแสดงผลคิวรูปภาพที่เตรียมยิง
        function updateUploadUI() {
            if (selectedFilesBucket.length > 0) {
                statusBar.style.display = 'block';
                statusText.innerText = `เตรียมเคลื่อนพลทหารจิ๋ว: ${selectedFilesBucket.length} นาย (Chibi Batch Ready)`;
                
                previewGrid.innerHTML = ''; // ล้างบอร์ดเก่า
                
                // เรนเดอร์ตัวอย่างรูปแนวกองทัพทหาร
                selectedFilesBucket.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        div.innerHTML = `<img src="${e.target.result}" alt="chibi-soldier">`;
                        previewGrid.appendChild(div);
                    }
                    reader.readAsDataURL(file);
                });
            } else {
                statusBar.style.display = 'none';
            }
            scrollToBottom();
        }

        // ยิงข้อมูลส่งออก (Send Logic)
        function executeSend() {
            const textContent = chatMsg.value.trim();
            
            // ตรวจสอบว่ามีวัตถุระเบิด/คำสั่งหรือไม่
ใช้โค้ดอย่างระมัดระวัง

const userMsgDiv = document.createElement('div');
userMsgDiv.className = 'msg msg-user';
if (textContent !== "") {
userMsgDiv.innerHTML = <div>${textContent}</div>;
}
// 2. ถ้ามีการโหลดภาพทหารจิ๋วแบบ Bulk มา ให้จัดการแนบพ่วงลงในแชทก้อนเดียวกันทันที!
if (selectedFilesBucket.length > 0) {
const imgGrid = document.createElement('div');
imgGrid.className = 'preview-grid';
imgGrid.style.marginTop = '10px';
let processedCount = 0;
const totalFiles = selectedFilesBucket.length;
selectedFilesBucket.forEach((file) => {
const reader = new FileReader();
reader.onload = function(e) {

imgItem.className = 'preview-item';
imgItem.style.borderColor = '#000'; // ปรับดีไซน์ในกล่องข้อความผู้ใช้

}

}

} else {
falconMsgDiv.innerHTML = [FALCON]: ระบบรับคำสั่งข้อความเรียบร้อย พร้อมลุยภารกิจ NextWeb-Studio แล้วครับบอส!;
}
chatFeed.appendChild(falconMsgDiv);
scrollToBottom();
// เคลียร์ถังพักไฟล์เมื่อส่งเสร็จสิ้น
selectedFilesBucket = [];
fileInput.value = ''; // Reset Input
updateUploadUI();
}, 800);
// เคลียร์กล่องพิมพ์คำสั่ง
chatMsg.value = '';
scrollToBottom();
}
function handleKeyPress(event) {
if (event.key === 'Enter') {
executeSend();
}
}
function scrollToBottom() {

ใช้มือถือรันระบบแชทพ่วง API Gateway และส่งรูปภาพมหาประลัย (Bulk Upload) ไหวแน่นอน 100% ครับบอส! มือถือยุคนี้แรงเหลือเฟือที่จะรับหน้าที่เป็น "แผงควบคุมหลัก"
แต่เพื่อให้ระบบลื่นไหล ไม่ค้าง และไม่กินแบตเตอรี่เครื่องของบอส เราต้องใช้ เทคนิคการวางท่อส่งข้อมูลแบบพิเศษ บนฝั่ง Frontend ดังนี้ครับ:
🛠️ 3 เทคนิค ลุยสายตรงผ่านมือถือให้ลื่นไหล
1. ยิงรูปแบบ Multipart FormData: ใช้สคริปต์ JavaScript มัดรวมไฟล์ภาพ Chibi ทั้งหมดใส่ลงในวัตถุ FormData แล้วยิงผ่าน fetch() ไปยัง API หลังบ้านในคำขอ (Request) เดียว วิธีนี้ลดการส่งสัญญาณซ้ำซ้อน ช่วยให้เน็ตมือถือทำงานน้อยลง
2. บีบอัดภาพก่อนส่ง (Client-Side Compression): รูปจากกล้องมือถือปัจจุบันไฟล์ใหญ่มาก (3-10 MB ต่อรูป) หากส่งพร้อมกัน 10 รูป หน้าจออาจค้างได้ เราจะใช้ JavaScript Canvas API ย่อขนาดรูปทหารจิ๋ว Chibi ให้เหลือประมาณ 500KB - 1MB อัตโนมัติในเสี้ยววินาทีก่อนยิงออกไป
3. ระบบโครงสร้าง API Endpoint ยืดหยุ่น: เราจะเขียนฟังก์ชันรองรับ URL สองระบบ (Dual-Route) คือ:
Development Route: จำลองส่งข้อมูลในเครื่องตัวเอง (Mock API) สำหรับตอนบอสทดสอบระบบบนมือถือแบบออฟไลน์
Production Route: ท่อจริงสำหรับยิงเข้า Server หลังบ้าน (เช่น Node.js, Python FastAPI หรือ Cloudflare Workers) เมื่อบอสพร้อมเปิดระบบจริง
📡 พิมพ์เขียว JavaScript ยกระดับระบบเชื่อมต่อ API (ท่อส่งมหาประลัย)
บอสสามารถนำชุดคำสั่ง (Function) นี้ไปฝังเพิ่มในส่วน <script> ของพิมพ์เขียวเดิม เพื่อเตรียมระบบท่อส่ง API Gateway ได้เลยครับ:
javascript
// CONFIGURATION: พิกัดฐานทัพหลังบ้าน
const API_CONFIG = {
    // เปลี่ยนเป็น URL เซิร์ฟเวอร์จริงของบอสในอนาคต (เช่น https://nextweb.studio)
    BASE_URL: "https://httpbin.org", 
    IS_MOCK_MODE: false // ปรับเป็น true ถ้าต้องการแค่จำลองการส่งในเครื่อง ไม่ยิงออกเน็ต
};

// ฟังก์ชันมหาประลัย: บีบอัดและมัดรวมไฟล์ยิงเข้า API Gateway
async function uploadSoldierPayload(textMessage, filesArray) {
    if (API_CONFIG.IS_MOCK_MODE) {
        console.log("[MOCK] ยิงข้อมูลจำลองภายในเครื่องสำเร็จ");
        return { status: "success", mock: true };
    }

    // 1. เตรียมกล่องบรรจุภัณฑ์ Multipart
    const formData = new FormData();
    formData.append("command_text", textMessage);
    formData.append("timestamp", new Date().toISOString());

    // 2. ลูปจัดการบีบอัดไฟล์ภาพทหารจิ๋ว Chibi ทีละนายก่อนแพ็กลงกล่อง (ลดภาระเน็ตมือถือ)
    for (let i = 0; i < filesArray.length; i++) {
        const file = filesArray[i];
        
        try {
            // เรียกใช้ฟังก์ชันบีบอัดภาพ (รีดขนาดให้เบาหวิว)
            const compressedBlob = await compressImageOnClient(file, 800, 0.7);
            formData.append("chibi_soldiers", compressedBlob, `chibi_${i}.jpg`);
            console.log(`[PACKED] รีดขนาดทหารจิ๋วนายที่ ${i+1} สำเร็จ`);
        } catch (err) {
            // หากบีบอัดพลาด ให้ส่งไฟล์ต้นฉบับไปแทนเพื่อป้องกันภารกิจล้มเหลว
            formData.append("chibi_soldiers", file);
            console.log(`[WARN] ส่งไฟล์ดิบเนื่องจาก: ${err.message}`);
        }
    }

    // 3. ยิงกระสุนผ่านท่อ HTTP Fetch API ไปยังปลายทาง
    try {
        const response = await fetch(API_CONFIG.BASE_URL, {
            method: "POST",
            body: formData
            // ข้อควรระวังบนมือถือ: ไม่ต้องใส่ Header Content-Type เอง เบราว์เซอร์จะจัดการ Boundary ให้โดยอัตโนมัติ
        });

        if (!response.ok) throw new Error(`HTTP ERROR STATUS: ${response.status}`);
        
        const result = await response.json();
        console.log("[GATEWAY-SUCCESS]: ส่งกองกำลังเข้าสู่เซิร์ฟเวอร์ภายนอกเรียบร้อย!", result);
        return result;

    } catch (error) {
        console.error("[GATEWAY-CRITICAL-ERROR]: ท่อส่งสัญญาณขัดข้อง!", error);
        alert("สัญญาณหลุด! ไม่สามารถติดต่อฐานทัพหลังบ้านได้");
        throw error;
    }
}
