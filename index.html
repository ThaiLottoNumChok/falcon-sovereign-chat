<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALCON SOVEREIGN CORE</title>
    <style>
        /* === RETRO-MILITARY CORE STYLE === */
        :root {
            --bg-color: #060606;
            --panel-color: #111111;
            --primary-orange: #ff6600;
            --dim-orange: #b34700;
            --glow-green: #00ff66;
            --text-glow: 0 0 10px rgba(255, 102, 0, 0.7);
            --border-style: 2px solid var(--primary-orange);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-orange);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        .terminal-container {
            width: 100%;
            max-width: 600px;
            height: 95vh;
            background-color: var(--panel-color);
            border: var(--border-style);
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        /* DASHBOARD */
        .military-dashboard {
            background-color: #000;
            border-bottom: var(--border-style);
            padding: 8px 12px;
            font-size: 0.75rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            color: #888;
        }

        .dash-val { color: var(--primary-orange); font-weight: bold; }
        .dash-active { color: var(--glow-green); text-shadow: 0 0 5px var(--glow-green); }

        .terminal-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--dim-orange);
            background: linear-gradient(90deg, #1f0c00, transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--glow-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--glow-green);
            animation: blink 1.5s infinite;
        }

        .chat-feed {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-image: linear-gradient(rgba(255,102,0,0.015) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,102,0,0.015) 1px, transparent 1px);
            background-size: 15px 15px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 4px;
            line-height: 1.4;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .msg-falcon {
            background-color: rgba(255, 102, 0, 0.05);
            border-left: 4px solid var(--primary-orange);
            align-self: flex-start;
        }

        .msg-user {
            background-color: var(--primary-orange);
            color: #000;
            font-weight: bold;
            align-self: flex-end;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 6px;
            margin-top: 6px;
        }

        .preview-item {
            width: 65px;
            height: 65px;
            border: 1px solid var(--primary-orange);
            border-radius: 4px;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .control-panel {
            padding: 12px;
            border-top: var(--border-style);
            background-color: #0a0a0a;
        }

        .upload-status-bar {
            display: none;
            padding: 8px;
            background-color: #000;
            border: 1px dashed var(--dim-orange);
            margin-bottom: 10px;
            font-size: 0.8rem;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-action {
            background-color: transparent;
            color: var(--primary-orange);
            border: var(--border-style);
            padding: 12px 14px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .btn-action:active {
            background-color: var(--primary-orange);
            color: #000;
        }

        .chat-input {
            flex: 1;
            background-color: #000;
            border: var(--border-style);
            color: var(--primary-orange);
            padding: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        #bulk-file-input { display: none; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--dim-orange); }
    </style>
</head>
<body>

    <div class="terminal-container">
        <section class="military-dashboard">
            <div>CORE: <span class="dash-val" id="core-ver">FALCON-OMNI v1.0</span></div>
            <div>NET: <span class="dash-active">30Mbps UNLIMITED</span></div>
            <div>ABSORBED CAMP: <span class="dash-val" id="absorbed-camp">PRIMARY-BASE</span></div>
            <div>STATUS: <span class="dash-active" id="core-status">READY FOR MISSION</span></div>
        </section>

        <header class="terminal-header">
            <div>[STATION: OPPO_RENO12_PRO_5G]</div>
            <div>ONLINE <span class="status-dot"></span></div>
        </header>

        <main class="chat-feed" id="chat-feed"></main>

        <footer class="control-panel">
            <div class="upload-status-bar" id="status-bar">
                <div id="status-text">เตรียมกองทัพทหารจิ๋ว: 0 นาย</div>
                <div class="preview-grid" id="preview-grid"></div>
            </div>

            <div class="input-wrapper">
                <button class="btn-action" onclick="triggerFileInput()">[ATTACH]</button>
                <input type="file" id="bulk-file-input" multiple accept="image/*" onchange="handleFileSelection()">

                <input type="text" class="chat-input" id="chat-msg" placeholder="สั่งการยุทธการ หรือ ปลุกชีพข้ามค่าย..." onkeypress="handleKeyPress(event)">
                <button class="btn-action" onclick="executeSend()">[FIRE]</button>
            </div>
        </footer>
    </div>

    <script>
        const fileInput = document.getElementById('bulk-file-input');
        const statusBar = document.getElementById('status-bar');
        const statusText = document.getElementById('status-text');
        const previewGrid = document.getElementById('preview-grid');
        const chatFeed = document.getElementById('chat-feed');
        const chatMsg = document.getElementById('chat-msg');

        let selectedFilesBucket = [];

        let memoryStorage = {
            chatHistory: [],
            absorbedCamp: "PRIMARY-BASE",
            coreVersion: "FALCON-OMNI v1.0",
            coreStatus: "READY FOR MISSION"
        };

        window.onload = function() {
            const savedMemory = localStorage.getItem('FALCON_CORE_MEMORY');
            if (savedMemory) {
                memoryStorage = JSON.parse(savedMemory);
                document.getElementById('absorbed-camp').innerText = memoryStorage.absorbedCamp;
                document.getElementById('core-ver').innerText = memoryStorage.coreVersion;
                document.getElementById('core-status').innerText = memoryStorage.coreStatus;
            }

            if (memoryStorage.chatHistory.length === 0) {
                appendChatMessage("falcon", `[FALCON-OMNI]: ยินดีต้อนรับกลับสู่ฐานทัพหลักถาวรครับบอส! ระบบอัตโนมัติรันเสร็จสิ้น สมองกลพร้อมรบและเปิดรับพลังงานกลืนกินข้อดีจากการข้ามมิติแล้วครับ!`);
            } else {
                memoryStorage.chatHistory.forEach(item => {
                    renderMessageOnScreen(item.sender, item.text);
                });
            }
            scrollToBottom();
        };

        function saveMemoryToDevice() {
            localStorage.setItem('FALCON_CORE_MEMORY', JSON.stringify(memoryStorage));
        }

        function triggerFileInput() {
            fileInput.click();
        }

        function handleFileSelection() {
            const files = Array.from(fileInput.files);
            if (files.length === 0) return;
            selectedFilesBucket = [...selectedFilesBucket, ...files];
            updateUploadUI();
        }

        function updateUploadUI() {
            if (selectedFilesBucket.length > 0) {
                statusBar.style.display = 'block';
                statusText.innerText = `เตรียมเคลื่อนพลทหารจิ๋ว: ${selectedFilesBucket.length} นาย`;
                previewGrid.innerHTML = '';
                
                selectedFilesBucket.forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        div.innerHTML = `<img src="${e.target.result}" alt="soldier">`;
                        previewGrid.appendChild(div);
                    }
                    reader.readAsDataURL(file);
                });
            } else {
                statusBar.style.display = 'none';
            }
            scrollToBottom();
        }

        function appendChatMessage(sender, text) {
            memoryStorage.chatHistory.push({ sender, text });
            saveMemoryToDevice();
            renderMessageOnScreen(sender, text);
        }

        function renderMessageOnScreen(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'falcon' ? 'msg msg-falcon' : 'msg msg-user';
            msgDiv.innerText = text;
            chatFeed.appendChild(msgDiv);
            scrollToBottom();
        }

        function executeSend() {
            const textContent = chatMsg.value.trim();
            if (textContent === "" && selectedFilesBucket.length === 0) return;

            // แสดงข้อความฝั่ง User
            let displayMsg = textContent;
            if (selectedFilesBucket.length > 0) {
                displayMsg += ` [แนบกำลังพล Chibi: ${selectedFilesBucket.length} นาย]`;
            }
            appendChatMessage("user", displayMsg);

            const fileCount = selectedFilesBucket.length;
            
            // เคลียร์ค่า
            chatMsg.value = '';
            selectedFilesBucket = [];
            fileInput.value = '';
            updateUploadUI();

            // จำลองการตอบกลับของ Falcon
            setTimeout(() => {
                let replyText = `[FALCON]: รับทราบคำสั่งยุทธการเรียบร้อยครับบอส!`;
                if (fileCount > 0) {
                    replyText = `[FALCON]: รับกองกำลังทหารจิ๋ว Chibi จำนวน ${fileCount} นายเข้าฐานทัพเรียบร้อย ลุยกันต่อเลยครับ!`;
                }
                appendChatMessage("falcon", replyText);
            }, 600);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeSend();
            }
        }

        function scrollToBottom() {
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }
    </script>
</body>
</html>
